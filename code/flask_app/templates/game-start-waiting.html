<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- This line below is mostly for debugging -->
    <link rel="stylesheet" href="../static/style.css">
    <head>
        <meta charset="UTF-8">
        <title>waiting...</title>
        <!-- Time for JS frontend.
         We'll be checking to see if our room is ready to start yet
         (this determined by the "accepting_new_players" value in our
          metadata dictionary) -->
        <script>
            function checkForGameStart () {
                fetch('/check-game-start')
                    .then(response => response.json())
                    .then(data=> {
                        if (data.redirect == "TRUE") {
                            // send us to a new page
                            window.location.href = '/writing-page';
                        }
                    })
                    .catch(error => console.error('Que paia! Error:', error));
            }
            // let's do this check every 10 seconds.
            setInterval(checkForGameStart, 10*1000);
        </script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
    </head>
    <header>
        The Story Game - online
    </header>
    <body>
        <div class="centered-div">
            <pre class="content">You are in the room owned by: {{ room_owner }}</pre>
            <p class="content">Waiting for the game to start</p>
        </div>
        <div class="centered-div">
            <div id="loader"></div>
        </div>
    </body>
</html>
