<!DOCTYPE html>
<html lang="en">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <head>
        <meta charset="UTF-8">
        <title>The Story Game</title>
    </head>
    <body>
        <h2>Rigmarole ONLINE</h2>
        <h3>The stories are written! Here they are below...</h3>
        <!-- loopin time -->
         <div>
            {% for i_story in stories %}
                <div class="story-div">
                    <h4>{{ i_story.author }}</h4>
                    <pre style="font-family:Arial, Helvetica, sans-serif;"
                    > {{ i_story.content }}</pre>
                </div>
            {% endfor %}
         </div>
    </body>
</html>
